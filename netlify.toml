[build]
  base = "."
  # Explicit `prisma generate` before the web build, rather than relying on it
  # happening implicitly via the `prisma` package's postinstall hook: when
  # Netlify restores node_modules from its build cache, npm install can skip
  # postinstall for already-present packages, leaving the bundled function
  # running a Prisma Client generated from a stale, previously-cached
  # schema.prisma instead of the one actually in this commit.
  command = "npm run db:generate -w server && npm run build --workspace=web"
  publish = "web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Prisma's generated client ships a portable WASM query engine (used because the
  # driver adapter in server/src/db.ts is active) rather than a native binary — make
  # sure it's included in the function zip even if auto-detection misses it.
  included_files = ["node_modules/.prisma/client/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
