  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--space-10:40px;\n--space-12:48px;\n--space-16:64px;\n--space-20:80px;\n--space-24:96px;\n\n--radius-sm:4px;\n--radius-md:8px;\n--radius-lg:14px;\n--radius-pill:999px;\n--radius-circle:50%;\n\n--container-max:1200px;\n--container-pad:24px;\n}\n\n<\u002Fstyle>\n<script src=\"5bb5ea6e-e06d-4316-b617-a981ccebca5a\"><\u002Fscript>\n<style>\nbody{margin:0;background:#eef1f4}\n*{box-sizing:border-box}\na{color:#1f5dc4;text-decoration:none}\na:hover{color:#2c9dfd}\ninput,button,textarea{font-family:'Poppins',system-ui,sans-serif}\ninput[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}\ninput[type=number]{-moz-appearance:textfield}\n.bcs::-webkit-scrollbar{width:0;height:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#eef1f4;font-family:'Poppins',system-ui,sans-serif;color:#454e58\">\n\n  <div style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:24px;padding:14px 28px;background:#000;color:#fff\">\n    <img src=\"f3e74fff-321c-40a0-bb32-9f371305bf34\" alt=\"BoedtCamp\" style=\"height:56px;width:auto;display:block\">\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b8f94\">Training en Voeding · prototype<\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.08);border-radius:999px\">\n      <button sc-camel-on-click=\"{{ goClient }}\" style=\"{{ tabClientStyle }}\">Klant-app<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goTrainer }}\" style=\"{{ tabTrainerStyle }}\">Trainer<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goData }}\" style=\"{{ tabDataStyle }}\">Data &amp; API<\u002Fbutton>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ resetAll }}\" style=\"padding:8px 14px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#c7c9cc;border-radius:999px;font-size:12px;cursor:pointer\">Reset demo<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isClient }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;gap:36px;align-items:flex-start;justify-content:center;padding:36px 28px 64px;flex-wrap:wrap\">\n\n    <div style=\"width:300px;display:flex;flex-direction:column;gap:16px;padding-top:10px\">\n      <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:26px;color:#000;line-height:1.1\">Klant-app<\u002Fdiv>\n      <div style=\"height:1px;background:#e8ebee\"><\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b8f94\">Variant trainingsscherm<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <button sc-camel-on-click=\"{{ setVarA }}\" style=\"{{ varAStyle }}\">\n          <span style=\"font-weight:600;font-size:13.5px\">A · Compacte lijst<\u002Fspan>\n          <span style=\"display:block;font-size:12px;color:#7c8794;margin-top:3px\">Sets als rijen, veel oefeningen in beeld<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ setVarB }}\" style=\"{{ varBStyle }}\">\n          <span style=\"font-weight:600;font-size:13.5px\">B · Groot &amp; rustig (50+)<\u002Fspan>\n          <span style=\"display:block;font-size:12px;color:#7c8794;margin-top:3px\">Eén set per blok, ± knoppen van 48px<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#e8ebee\"><\u002Fdiv>\n      <div style=\"font-size:12px;line-height:1.7;color:#7c8794\">\n        <div style=\"color:#454e58;font-weight:600;margin-bottom:6px\">Probeer<\u002Fdiv>\n        Tik een oefening open · pas het gewicht aan · vink de set af · start de rust · rond de training af en geef feedback.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:390px;height:844px;background:#000;border-radius:46px;padding:11px;box-shadow:0 4px 10px rgba(10,14,20,.10),0 26px 60px rgba(10,14,20,.28);flex:none\">\n      <div style=\"position:relative;width:100%;height:100%;background:#fff;border-radius:36px;overflow:hidden;display:flex;flex-direction:column\">\n\n        <div style=\"flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 24px 4px;font-size:13px;font-weight:600;color:#000\">\n          <span>9:41<\u002Fspan>\n          <span style=\"display:flex;gap:5px;align-items:center\">\n            <span style=\"width:17px;height:10px;border:1.5px solid #000;border-radius:3px;display:inline-block\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ isKies }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"bcs\" style=\"flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b8f94\">{{ todayLabel }}<\u002Fdiv>\n            <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:28px;color:#000;line-height:1.1;margin-top:4px\">Hallo {{ clientFirst }}<\u002Fdiv>\n            <div style=\"font-size:15px;color:#7c8794;margin-top:8px\">{{ kiesQuestion }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">\n            <sc-for list=\"{{ kiesCalcCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:#000;border-radius:14px;padding:14px 12px\">\n                <div style=\"font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#2c9dfd\">{{ c.label }}<\u002Fdiv>\n                <div style=\"{{ c.valStyle }}\">{{ c.value }}<\u002Fdiv>\n                <div style=\"{{ c.subStyle }}\">{{ c.sub }}<\u002Fdiv>\n                <div style=\"font-size:10px;color:#8b8f94;margin-top:3px\">{{ c.when }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ goTraining }}\" style=\"display:flex;align-items:center;gap:16px;text-align:left;border:0;cursor:pointer;border-radius:18px;padding:18px 20px;color:#fff;background:#000 url(&quot;abeae7d3-9c5f-4f43-b7c7-f796c4907ad1&quot;) right center/cover no-repeat\">\n            <span style=\"flex:1;min-width:0\">\n              <span style=\"display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2c9dfd\">Vandaag · week {{ weekNo }}<\u002Fspan>\n              <span style=\"display:block;font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:22px;margin-top:5px;line-height:1.05\">Trainen<\u002Fspan>\n              <span style=\"display:block;font-size:12.5px;color:#c7c9cc;margin-top:5px\">{{ dayTitle }} · {{ trainCardMeta }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"flex:none;width:40px;height:40px;border-radius:999px;background:linear-gradient(135deg,#2c9dfd,#1f5dc4);display:flex;align-items:center;justify-content:center;font-size:17px\">›<\u002Fspan>\n          <\u002Fbutton>\n\n          <button sc-camel-on-click=\"{{ goFood }}\" style=\"display:flex;align-items:center;gap:16px;text-align:left;border:0;cursor:pointer;border-radius:18px;padding:18px 20px;color:#fff;background:#000 url(&quot;abeae7d3-9c5f-4f43-b7c7-f796c4907ad1&quot;) right center/cover no-repeat\">\n            <span style=\"flex:1;min-width:0\">\n              <span style=\"display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2c9dfd\">Vandaag<\u002Fspan>\n              <span style=\"display:block;font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:22px;margin-top:5px;line-height:1.05\">Voeding registreren<\u002Fspan>\n              <span style=\"display:block;font-size:12.5px;color:#c7c9cc;margin-top:5px\">{{ foodCardMeta }}<\u002Fspan>\n              <span style=\"display:block;height:6px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:9px;overflow:hidden\"><span style=\"{{ foodCardBarStyle }};display:block\"><\u002Fspan><\u002Fspan>\n der:1.5px dashed #c2c8cf;background:transparent;border-radius:12px;font-size:13px;color:#8b8f94;cursor:pointer\">+ Trainingsdag<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:16px;padding:20px 24px;margin-top:16px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;box-shadow:0 1px 2px rgba(10,14,20,.05)\">\n        <div style=\"flex:1;min-width:280px\">\n          <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;margin-bottom:6px\">Titel van deze trainingsdag<\u002Fdiv>\n          <input type=\"text\" value=\"{{ dayTitleValue }}\" sc-camel-on-change=\"{{ onDayTitle }}\" style=\"width:100%;height:44px;padding:0 14px;border:1.5px solid #e8ebee;border-radius:10px;font-size:15px;font-weight:600;color:#000;outline:none\">\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleRotate }}\" style=\"{{ rotateStyle }}\">\n          <span style=\"{{ rotateDotStyle }}\"><\u002Fspan>\n          <span style=\"font-size:13px\">Rouleer core &amp; mobiliteit uit de pool<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toggleRow }}\" style=\"{{ rowToggleStyle }}\">\n          <span style=\"{{ rowToggleDotStyle }}\"><\u002Fspan>\n          <span style=\"font-size:13px\">Roeisessie met opbouw<\u002Fspan>\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onRemoveDay }}\" style=\"{{ removeDayStyle }}\">✕ Dag verwijderen<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:16px;padding:20px 24px;margin-top:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 2px rgba(10,14,20,.05)\">\n        <div style=\"flex:1;min-width:260px\">\n          <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:17px;color:#000\">“{{ copyDayTitle }}” kopiëren naar een andere klant<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8b8f94;margin-top:3px;text-wrap:pretty\">{{ copyDayMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ copyDayTargets }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ c.pick }}\" style=\"text-align:left;padding:11px 16px;border:1.5px solid #2c9dfd;background:rgba(44,157,253,.08);border-radius:12px;cursor:pointer\">\n              <span style=\"display:block;font-size:13.5px;font-weight:600;color:#1f5dc4\">{{ c.label }}<\u002Fspan>\n              <span style=\"display:block;font-size:11.5px;color:#8b8f94;margin-top:1px\">{{ c.meta }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isDay3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:16px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 2px rgba(10,14,20,.05)\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap\">\n            <div style=\"max-width:46ch\">\n              <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:19px;color:#000\">Blok 2 · roeiopbouw<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8b8f94;margin-top:2px\">De app rekent de roeitijd elke week zelf op. Startduur × (1 + %) per week — de klant ziet enkel het getal van vandaag en wat ze vorige week deed.<\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-top:18px;flex-wrap:wrap\">\n                <div>\n                  <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;margin-bottom:6px\">Startduur (min)<\u002Fdiv>\n                  <input type=\"number\" value=\"{{ rowBase }}\" sc-camel-on-change=\"{{ onRowBase }}\" style=\"height:40px;width:110px;padding:0 12px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;margin-bottom:6px\">Toename / week<\u002Fdiv>\n                  <input type=\"number\" value=\"{{ rowPct }}\" sc-camel-on-change=\"{{ onRowPct }}\" style=\"height:40px;width:110px;padding:0 12px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;margin-bottom:6px\">Huidige week<\u002Fdiv>\n                  <input type=\"number\" value=\"{{ rowWeek }}\" sc-camel-on-change=\"{{ onRowWeek }}\" style=\"height:40px;width:110px;padding:0 12px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;color:#7c8794;margin-top:16px\">Vandaag <strong style=\"color:#000\">{{ rowNow }} min<\u002Fstrong> · volgende week {{ rowNext }} min<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:280px\">\n              <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;margin-bottom:14px\">Opbouw over 8 weken (min)<\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:10px;height:150px\">\n                <sc-for list=\"{{ rowLadder }}\" as=\"r\" hint-placeholder-count=\"8\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end\">\n                    <div style=\"font-size:12px;font-weight:600;color:#454e58\">{{ r.val }}<\u002Fdiv>\n                    <div style=\"{{ r.barStyle }}\"><\u002Fdiv>\n                    <div style=\"font-size:11px;color:#8b8f94\">{{ r.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:16px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 2px rgba(10,14,20,.05)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n          <div>\n            <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:19px;color:#000\">{{ dayTitle }}<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b8f94;margin-top:2px\">Pas sets, herhalingen, doelgewicht en rust aan — wijzigingen staan direct in de app van deze klant.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#1f5dc4;font-weight:600\">{{ editorSaved }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:34px 1.4fr .8fr .45fr .6fr .8fr .5fr 1fr 40px;gap:10px;margin-top:20px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;padding-bottom:10px;border-bottom:1px solid #e8ebee\">\n          <div><\u002Fdiv><div>Oefening<\u002Fdiv><div>Blok<\u002Fdiv><div>Sets<\u002Fdiv><div>Herh. / tijd<\u002Fdiv><div>Doelgewicht<\u002Fdiv><div>Rust<\u002Fdiv><div>Videolink<\u002Fdiv><div><\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ editorRows }}\" as=\"e\" hint-placeholder-count=\"13\">\n          <div style=\"{{ e.rowStyle }}\">\n            <div style=\"display:flex;flex-direction:column;gap:3px;align-items:center\">\n              <button sc-camel-on-click=\"{{ e.onUp }}\" title=\"Omhoog\" style=\"{{ e.moveStyle }}\">▲<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ e.onDown }}\" title=\"Omlaag\" style=\"{{ e.moveStyle }}\">▼<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;min-width:0\">\n              <div style=\"{{ e.tagStyle }}\">{{ e.tag }}<\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;color:#000\">{{ e.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8b8f94\">{{ e.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:0\">\n              <sc-raw-select value=\"{{ e.block }}\" sc-camel-on-change=\"{{ e.onBlock }}\" style=\"{{ e.blockSelectStyle }}\">\n                <sc-for list=\"{{ e.blockOptions }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <option value=\"{{ b.value }}\">{{ b.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <span style=\"{{ e.blockTextStyle }}\">{{ e.blockLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"number\" value=\"{{ e.sets }}\" sc-camel-on-change=\"{{ e.onSets }}\" style=\"height:38px;padding:0 10px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none;width:100%\">\n            <input type=\"number\" value=\"{{ e.reps }}\" sc-camel-on-change=\"{{ e.onReps }}\" style=\"height:38px;padding:0 10px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none;width:100%\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <input type=\"number\" step=\"{{ e.step }}\" value=\"{{ e.load }}\" sc-camel-on-change=\"{{ e.onLoad }}\" style=\"{{ e.loadStyle }}\">\n              <span style=\"{{ e.bwStyle }}\">lichaamsgewicht<\u002Fspan>\n              <span style=\"font-size:12px;color:#8b8f94;flex:none\">{{ e.unitLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"number\" step=\"15\" value=\"{{ e.rest }}\" sc-camel-on-change=\"{{ e.onRest }}\" style=\"height:38px;padding:0 10px;border:1.5px solid #e8ebee;border-radius:9px;font-size:14px;color:#000;outline:none;width:100%\">\n            <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n              <input type=\"text\" value=\"{{ e.video }}\" sc-camel-on-change=\"{{ e.onVideo }}\" placeholder=\"https://…\" style=\"height:38px;padding:0 10px;border:1.5px solid #e8ebee;border-radius:9px;font-size:12.5px;color:#454e58;outline:none;width:100%;min-width:0\">\n              <a href=\"{{ e.video }}\" target=\"_blank\" rel=\"noreferrer\" style=\"flex:none;width:34px;height:34px;border-radius:9px;background:#f4f6f8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#1f5dc4;text-decoration:none\">▶<\u002Fa>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ e.onDrop }}\" title=\"Oefening verwijderen\" style=\"width:34px;height:38px;border:1.5px solid #e8ebee;background:#fff;border-radius:9px;font-size:14px;color:#c2c8cf;cursor:pointer\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid #e8ebee;flex-wrap:wrap\">\n          <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8b8f94;width:100%\">Snel toevoegen · eigen sjablonen<\u002Fdiv>\n          <sc-raw-select value=\"{{ addPick }}\" sc-camel-on-change=\"{{ onAddPick }}\" style=\"height:44px;min-width:320px;padding:0 12px;border:1.5px solid #e8ebee;border-radius:10px;font-size:14px;color:#000;background:#fff;outline:none\">\n            <sc-for list=\"{{ libOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n              <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <x-import component-from-global-scope=\"BoedtCampDesignSystem_d1ef37.Button\" variant=\"dark\" size=\"md\" on-click=\"{{ onAddExercise }}\" hint-size=\"auto,44px\">+ Toevoegen aan deze training<\u002Fx-import>\n          <div style=\"font-size:12.5px;color:#8b8f94;flex:1;min-width:220px\">Start met 3 sets en de standaardwaarden — daarna pas je sets, herhalingen, gewicht en rust in de rij aan.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:20px;padding-top:18px;border-top:1px solid #e8ebee\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:19px;color:#000\">Open oefeningenbibliotheek<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8b8f94;margin-top:2px\">Twee open bronnen samengevoegd: free-exercise-db (publiek domein) en wger (CC BY-SA, met Nederlandse namen). Filter op doel en op primaire spiergroep.<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ dbIdle }}\" hint-placeholder-val=\"{{ true }}\">\n              <x-import component-from-global-scope=\"BoedtCampDesignSystem_d1ef37.Button\" variant=\"primary\" size=\"md\" on-click=\"{{ loadDb }}\" hint-size=\"auto,44px\">Bibliotheek laden<\u002Fx-import>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dbLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13px;color:#1f5dc4;font-weight:600\">Bibliotheek laden…<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ dbOk }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13px;color:#8b8f94\">{{ dbCount }} oefeningen · {{ dbSources }} · {{ dbFound }} in deze selectie<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ dbFail }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding:14px 16px;border-radius:12px;background:#fff5f4;border:1.5px solid #ffd6d2;font-size:13px;color:#c9463c\">Bibliotheek kon niet geladen worden (netwerk geblokkeerd). In productie haal je deze lijst één keer op en bewaar je ze in je eigen database — de sjablonen hierboven blijven werken.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ dbOk }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:16px\">\n              <sc-for list=\"{{ goalTabs }}\" as=\"g\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ g.pick }}\" style=\"{{ g.style }}\">{{ g.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:10px\">\n              <sc-for list=\"{{ muscleTabs }}\" as=\"m\" hint-placeholder-count=\"10\">\n                <button sc-camel-on-click=\"{{ m.pick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <input type=\"text\" value=\"{{ dbQuery }}\" sc-camel-on-change=\"{{ onDbQuery }}\" placeholder=\"Zoek op naam of materiaal (bv. dumbbell, kettlebell, band)\" style=\"width:100%;height:44px;margin-top:14px;padding:0 14px;border:1.5px solid #e8ebee;border-radius:10px;font-size:14px;color:#000;outline:none\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px\">\n              <sc-for list=\"{{ dbResults }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #e8ebee;border-radius:12px\">\n                  <div style=\"{{ r.imgStyle }}\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:13.5px;font-weight:600;color:#000\">{{ r.name }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#8b8f94;margin-top:2px\">{{ r.muscle }} · {{ r.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ r.add }}\" style=\"flex:none;height:36px;padding:0 14px;border:1.5px solid #2c9dfd;background:rgba(44,157,253,.08);color:#1f5dc4;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer\">+ Voeg toe<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8b8f94;margin-top:12px\">{{ dbMore }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid #e8ebee;{{ poolRowStyle }}\">\n          <x-import component-from-global-scope=\"BoedtCampDesignSystem_d1ef37.Button\" variant=\"primary\" size=\"md\" on-click=\"{{ rotatePool }}\" dc-props=\"{{ nowrap }}\" hint-size=\"auto,46px\">Rouleer pool<\u002Fx-import>\n          <div style=\"font-size:12.5px;color:#7c8794\">Voor dagen met rotatie kiest de app elke week 3 mobiliteitsoefeningen (warming up) en 3 core-oefeningen (cooldown) uit de pool. Hiermee forceer je een nieuwe selectie.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isData }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1000px;margin:0 auto;padding:36px 28px 80px\">\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b8f94\">Techniek<\u002Fdiv>\n    <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:32px;color:#000;line-height:1.1;margin-top:4px\">Datamodel &amp; API<\u002Fdiv>\n    <p style=\"font-size:14px;line-height:1.7;color:#7c8794;max-width:70ch;text-wrap:pretty\">Dit prototype schrijft naar <code>localStorage<\u002Fcode> via één opslaglaag, zodat je alles kan testen zonder backend. Die laag heeft exact de vorm van de API hieronder — één bestand vervangen (bv. door Supabase- of Firestore-calls) volstaat om echt te persisteren.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px\">\n      <sc-for list=\"{{ tables }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:17px;color:#000\">{{ t.name }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8b8f94;margin-top:2px;margin-bottom:12px\">{{ t.desc }}<\u002Fdiv>\n          <sc-for list=\"{{ t.cols }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:10px;padding:5px 0;border-top:1px solid #f4f6f8\">\n              <div style=\"width:150px;flex:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#1f5dc4\">{{ c.n }}<\u002Fdiv>\n              <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#7c8794\">{{ c.t }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#000;color:#e8ebee;border-radius:14px;padding:22px 24px;margin-top:20px\">\n      <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:17px;color:#fff;margin-bottom:14px\">API-endpoints<\u002Fdiv>\n      <sc-for list=\"{{ endpoints }}\" as=\"e\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;gap:14px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);align-items:baseline\">\n          <div style=\"{{ e.mStyle }}\">{{ e.m }}<\u002Fdiv>\n          <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#fff;min-width:340px\">{{ e.p }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#8b8f94\">{{ e.d }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #e8ebee;border-radius:14px;padding:20px 22px;margin-top:20px\">\n      <div style=\"font-family:'Exo',sans-serif;font-style:italic;font-weight:900;font-size:17px;color:#000;margin-bottom:10px\">Volgende stappen<\u002Fdiv>\n      <sc-for list=\"{{ nextSteps }}\" as=\"s\" hint-p
